# 追加到宿主机 /home/ubuntu/apps/fuyou/deploy/h5-ip-https.conf，
# 由 fuyou-h5-https-1（443 端口 nginx）按子域名反代到独立游戏容器。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name game.xiaoannurse.art;

    ssl_certificate /etc/letsencrypt-system/live/game.xiaoannurse.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-system/live/game.xiaoannurse.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://superagent-game-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
