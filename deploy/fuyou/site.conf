server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml application/wasm;

    add_header X-Content-Type-Options nosniff always;

    # 静态资源长缓存；入口 HTML 不缓存，便于持续测试拿到新 build。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 入口
    location / {
        try_files $uri $uri/ /index.html;
    }
}
