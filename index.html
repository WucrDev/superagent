<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f0b" />
    <title>Superagent · 越野灰盒原型</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" aria-live="polite">
      <div class="badge">W3 绞盘 · three.js + Rapier</div>
      <div class="speed"><span id="speed">0</span><span class="unit">km/h</span></div>
      <div class="meta">
        <span class="gear" id="gear">L</span>
        <span class="sep">/</span>
        <span id="camera">第三人称</span>
        <span class="sep">/</span>
        <span id="device">键盘</span>
      </div>
      <div class="help">
        WASD 或手柄左摇杆驾驶 · RT/LT 油门/刹车 · Q/E 换档 · C 视角 · Space 手刹 · R 复位<br />
        F 绞盘瞄准/收绳 · G 挂钩/松绳 · X 换锚 · V 自动锚 · J 翻正 · H 张力条<br />
        右键拖动看 · 滚轮缩放 · Esc 设置
      </div>
    </div>

    <div id="winchPrompt" hidden></div>

    <div id="winchHud" hidden>
      <div class="winch-head">
        <span id="winchState">绞盘待机</span>
        <span id="winchAnchor"></span>
      </div>
      <div class="winch-tension" title="张力 / 上限">
        <div id="winchTensionFill"></div>
      </div>
      <div class="winch-meta">
        <span id="winchScore"></span>
        <span id="winchMessage"></span>
      </div>
      <svg id="angleRing" viewBox="-80 -80 160 160" aria-hidden="true">
        <circle class="ring-outer" cx="0" cy="0" r="54" />
        <circle class="ring-inner" cx="0" cy="0" r="26" />
        <line class="ring-axis" x1="0" y1="-60" x2="0" y2="60" />
        <line class="ring-axis" x1="-60" y1="0" x2="60" y2="0" />
        <line class="ring-cone" x1="0" y1="0" x2="-47" y2="-27" />
        <line class="ring-cone" x1="0" y1="0" x2="47" y2="-27" />
        <path class="ring-car" d="M 0 -8 L 6 8 L -6 8 Z" />
        <g id="winchDots"></g>
        <line id="winchLine" class="ring-line" x1="0" y1="0" x2="0" y2="0" />
      </svg>
      <div class="winch-hint">H 隐藏 · F 收绳 · G 松绳 · X 换锚 · V 自动 · J 翻正</div>
    </div>

    <div id="settings" hidden>
      <h2>设置</h2>
      <label>
        手柄死区
        <input id="deadzone" type="range" min="0" max="0.4" step="0.01" />
        <span id="deadzoneValue">0.15</span>
      </label>
      <label>
        转向灵敏度
        <input id="steerSensitivity" type="range" min="0.5" max="2" step="0.05" />
        <span id="steerValue">1.00</span>
      </label>
      <label>
        第三人称 FOV
        <input id="chaseFov" type="range" min="60" max="80" step="1" />
        <span id="chaseFovValue">65°</span>
      </label>
      <label>
        座舱 FOV
        <input id="cockpitFov" type="range" min="60" max="90" step="1" />
        <span id="cockpitFovValue">75°</span>
      </label>
      <button id="settingsClose" type="button">关闭 (Esc)</button>
    </div>

    <div id="loading">正在加载物理引擎…</div>
    <div id="error" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
